# SYNTEZA-SEARCHLOG.yaml — własny log weryfikacji uzupełniającej
# Ten log NIE powiela logów pięciu pakietów modeli. Zawiera wyłącznie operacje
# wykonane przez syntezę 2026-08-29 w celu niezależnego sprawdzenia tez,
# metadanych i statusu źródeł oraz w celu wypełnienia luk.

question: >
  Które tezy z pięciu niezależnych pakietów researchowych o poprawianiu polszczyzny
  generowanej przez AI wytrzymują niezależną weryfikację źródłową; gdzie zgodność
  modeli jest pozorna (jedno wspólne źródło); jakie dowody przeciwne pominięto.
date_run: 2026-08-29
role: "synteza krytyczna; raporty modeli = wejście do audytu, nie źródło naukowe"

tooling:
  available:
    - name: "paper-search MCP"
      endpoints: [search_openalex, search_crossref, search_semantic, search_arxiv, get_crossref_paper_by_doi]
      status: OK
    - name: WebFetch
      status: OK
    - name: WebSearch
      status: OK
  unavailable:
    - name: "openalex MCP (openalex-mcp-server)"
      status: "CONNECT_TIMEOUT — użyto search_openalex z paper-search jako zamiennika"
    - name: "Retraction Watch API"
      status: "brak dostępu; kontrolę korekt oparto o metadane Crossref i strony wydawców"
  access_note: >
    Większość weryfikacji odbyła się na poziomie METADANE + ABSTRAKT. Pełne teksty
    otwarte sprawdzono tylko tam, gdzie zaznaczono. Nigdzie nie twierdzę,
    że sprawdziłem fragment, którego nie widziałem.

inclusion:
  - "recenzowane czasopisma i konferencje (ACL/EMNLP/COLING/NAACL/ICML/ICLR/PNAS/Nature/PLOS/APA)"
  - "autorytatywne źródła normatywne dla polszczyzny (RJP PAN) i standardy (ISO, W3C, Unicode)"
  - "preprinty — wyłącznie z jawną flagą i bez samodzielnego uzasadniania mocnej reguły"
exclusion:
  - "raporty pięciu modeli jako źródło naukowe (są wejściem do audytu)"
  - "blogi, listy slów AI, vendorzy detektorów i humanizerów jako dowód"
  - "cytacje bez rozwiązywalnego DOI lub stabilnego rekordu"

# ---------------------------------------------------------------------------
# V — weryfikacja rekordów cytowanych przez co najmniej dwa modele
#     lub nośnych dla rdzenia działania skilla
# ---------------------------------------------------------------------------
verification:

  - id: V01
    target: "Reinhart et al. — Do LLMs write like humans? (PNAS)"
    method: crossref_doi
    query: "10.1073/pnas.2422455122"
    result: >
      POTWIERDZONE. PNAS 122(8), 2025-02-18. Autorzy: Reinhart, Markey, Laudenbach,
      Pantusen, Yurko, Weinberg, Brown. Abstrakt potwierdza: różnice utrzymują się przy
      wzroście skali i są WIĘKSZE dla modeli instruction-tuned niż bazowych.
    finding: >
      Lista autorów w MiniMax3 (Reinhart, Strobelt, Huber, Boxall) jest NIEPRAWDZIWA.
      Codex podaje poprawną.
    decision: "ACCEPT jako źródło; flaga metadanych dla MiniMax3"

  - id: V02
    target: "Liang et al. — GPT detectors are biased against non-native English writers"
    method: crossref_doi
