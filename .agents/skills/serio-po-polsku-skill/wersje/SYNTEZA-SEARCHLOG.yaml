    result: "POTWIERDZONE. Patterns 4(7), 100779, 2023-07. 512 cytowań."
    finding: >
      MiniMax3 podaje DOI 10.1016/j.patter.2023.100776 — BŁĘDNY.
      Poprawny: 100779 (zgodnie z Claude, Codex, cc_deepseek).
    decision: "ACCEPT; korekta DOI"

  - id: V03
    target: "Kontrdowód dla V02 — bias detektorów wobec osób nie-native"
    method: crossref_doi + websearch
    query: "10.1016/j.compedu.2024.105070 ; Jiang Hao Fauss Li 2024 GRE bias non-native"
    result: >
      POTWIERDZONE. Jiang, Hao, Fauss & Li (2024), Computers & Education 217, 105070.
      Duża, dobrze próbkowana baza GRE; detektory oparte na e-rater i perplexity działają
      bardzo dobrze; badanie wprost pyta o bias i nie replikuje prostej tezy Lianga.
    decision: "KRYTYCZNY KONTRDOWÓD — teza o biasie wymaga zawężenia"

  - id: V04
    target: "Drugi kontrdowód — replikacja w języku słowiańskim (czeski)"
    method: arxiv_search
    query: "Different Time Different Language Revisiting the Bias Against Non-Native Speakers in GPT Detectors"
    result: >
      ZNALEZIONE. Al Ali, Helcl & Libovický (2026), arXiv:2602.05769 [PREPRINT].
      Abstrakt: perplexity tekstów osób nie-native po CZESKU NIE jest niższa niż native;
      trzy rodziny detektorów — brak systematycznego biasu; współczesne detektory
      działają bez opierania się na perplexity.
    finding: >
      ŹRÓDŁA NIE ZNALAZŁ ŻADEN Z PIĘCIU PAKIETÓW. Jest to najbliższy dostępny analog
      dla polskiego (język słowiański, fleksyjny) i podważa transfer tezy Lianga na PL.
    decision: "WŁĄCZONE jako preprint z jawną flagą; podstawa werdyktu S-D04"

