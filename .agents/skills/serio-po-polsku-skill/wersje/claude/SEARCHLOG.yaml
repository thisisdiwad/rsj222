inclusion_criteria:
  - "Recenzowane artykuły naukowe z konferencji NLP/CL (ACL, EMNLP, NAACL, EACL, NeurIPS, ICML, ICLR, CHI)"
  - "Recenzowane czasopisma: Computational Linguistics, TACL, JASIST, Patterns (Cell Press), IJEI"
  - "Preprinty arXiv z wyraźnym oznaczeniem PREPRINT"
  - "Autorytety normatywne: Rada Języka Polskiego, WSJP PAN, NKJP, gramatyki opisowe IJP PAN"
  - "Daty: 2019-2026 dla NLP/LLM; bez ograniczeń dla lingwistyki polskiej i fundamentów"
  - "Języki: angielski i polski; języki pokrewne jako analogie INDIRECT"

exclusion_criteria:
  - "Blogi, artykuły SEO, content marketing — REJECT"
  - "Materiały komercyjne (vendor marketing, whitepaper) — REJECT"
  - "Posty mediów społecznościowych — REJECT"
  - "Czasopisma drapieżne (brak DOAJ/Scopus/WoS) — REJECT"
  - "Artykuły bez weryfikowalnego DOI lub stabilnego rekordu"

