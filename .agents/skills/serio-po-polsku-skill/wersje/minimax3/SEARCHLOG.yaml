skeptic_pass:
  date: 2026-08-16
  prompts_considered:
    - "Czy to, że LLM-teksty mają niższą dywersyfikację leksykalną, jest powszechne czy model-zależne?"
    - "Czy nominalizacja faktycznie jest cechą LLM-tekstów czy też stylu akademickiego?"
    - "Czy detektory są aż tak bezużyteczne? Jakie są realistyczne wskaźniki?"
    - "Czy wykryto znaczący spadek zdolności do generowania 'in-dystrybucyjnych' tekstów w najnowszych modelach?"
    - "Czy cechy opisane dla angielskiego przenoszą się na polski?"
    - "Czy stylistyka/redakcja w polskim kontekście jest specyficzna?"
  counter_evidence_found:
    - id: SK-1
      finding: "Nominalizacja to cecha akademicka, nie specyficznie AI (C14 UEA: +69.5% 1965→2015)"
      source: "academic naming: changing patterns of noun use in research writing (UEA 2020)"
      implication: "Ostrość krytyki 'nadmiernej nominalizacji' w AI-tekście musi uwzględniać konwencję gatunkową"
    - id: SK-2
      finding: "Binoculars TPR spada z 91% (GPT-3.5 era) do 39.5% (GPT-4o/Claude 4 era)"
      source: "Perkins et al. 2025 IJETHE"
      implication: "Twierdzenia o 'skuteczności' detektorów muszą być datowane; binoculars nie jest 'state of the art' dla GPT-4+"
    - id: SK-3
      finding: "Universal adversarial paraphrasing: średni spadek TPR@1%FPR 87.88% na 8 detektorach"
      source: "NeurIPS 2025"
      implication: "Detektory są atakowalne; detekcja = sygnał, nie verdict"
    - id: SK-4
      finding: "Pindrop ACL 2026: 12/64 kombinacji istotne; biasy różne między systemami"
      source: "Pindrop 2026"
      implication: "Nie ma 'jednego' biasu; każdy detektor trzeba testować osobno"
    - id: SK-5
      finding: "PolEval 2025 SMIGIEL: Gemma-27B + PLLuM-12B = 81.22% na unseen generators"
      source: "PolEval 2025 SMIGIEL"
      implication: "W polskim detekcja perpleksyjna działa, ale wymaga specyficznej konfiguracji"
    - id: SK-6
      finding: "LLM-teksty medyczne mają inne cechy niż akademickie eseje (np. więcej nominalizacji w naukach ścisłych)"
      source: "Nominalizations in Research Article Abstracts (2015)"
      implication: "Wzorce są gatunkowo-specyficzne; jednoznaczne listy 'AI-izmów' nie istnieją"
    - id: SK-7
      finding: "Co-writing (80% human + 20% AI): readers nie odróżniają od samodzielnego dzieła ludzkiego"
      source: "Padmakumar & He 2024 (arXiv 2411.13032)"
      implication: "Głos hybrydowy postrzegany jako autentyczny; nie należy karać współautorstwa"
  decisions:
    - "Transfer EN→PL: oznaczony jako DOWNGRADED w CLAIM-AUDIT; wzorzec spójny ale brak bezpośredniego dowodu polskiego dla każdej cechy"
    - "Vendor claims (Antyplagiat 95%, Isgen): pominięte jako EVIDENCE; brak independent audit"
    - "Dane industry/blog (NN/g, Smashing): zacytowane jako BACKGROUND/EVIDENCE dla industry-standard, nie dla nauki"
    - "Preprinty: zawsze oznaczone 'not peer-reviewed'; cytowane gdy treść recenzowana w innej pracy"

limitations_of_search:
  - "Brak dostępu do MCP paper-search/openalex w tej sesji; web_search fallback"
  - "Brak subagentów literature-scout/skeptic; wykonane ręcznie"
  - "Brak paywall-bypass; tylko open access + arXiv + ACL Anthology + PMC"
  - "PMC czasem wymagał captcha (web_fetch 403); DOI/arXiv alternative"
  - "Brak weryfikacji wszystkich cytowań przez Crossref API (ręczna weryfikacja przez URL)"
